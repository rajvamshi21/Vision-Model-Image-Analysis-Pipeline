name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests demo
      - run: pytest -q

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Generate the labelled synthetic corpus
        run: python demo/generate_sample_images.py --out data/sample --count 120
      - name: Reproduce the published metrics
        run: python demo/benchmark.py --data data/sample --json metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-metrics
          path: metrics.json

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vqa
          POSTGRES_PASSWORD: vqa
          POSTGRES_DB: vqa
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U vqa" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      VQA_DATABASE_URL: postgresql://vqa:vqa@localhost:5433/vqa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[db,dev]"
      - run: python demo/generate_sample_images.py --out data/sample --count 36
      - run: vqa init-db
      - run: vqa ingest data/sample --sku-from-name
      - run: vqa stats
